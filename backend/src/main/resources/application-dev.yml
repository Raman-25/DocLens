#database-configurations
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:doclens}
    username: ${DB_USER:postgres}
    password: postgres

  #jpa-configurations
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
  ai:
    model:
      chat: openai
      embedding:
        text: google-genai
    chat:                        #This creates the SPRING_AI_CHAT_MEMORY table on startup
        memory:
          repository:
            jdbc:
              initialize-schema: always
    openai:
      api-key: ${GROQ_API_KEY}
      chat:
        base-url: https://api.groq.com/openai/v1
        api-key: ${GROQ_API_KEY}
        options:
          model: ${GROQ_CHAT_MODEL:qwen/qwen3.8-27b}
          temperature: 0.2
          max-tokens: 500
    google:
      genai:
        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            options:
              model: gemini-embedding-001
              dimensions: 768
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768
        table-name: vector_store
        schema-name: public
        initialize-schema: true


  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 50MB

#app configurations
app:
  rag:
    chunk-size: 600  #har chunk max ~600 units ka
    chunk-overlap: 100  # 100 → next chunk pichle chunk ke last 100 units repeat karega — taaki koi sentence/idea beech se kat ke lost na ho jaye
    top-k: 5          #top-5 chunks
    similarity-threshold: 0.0  #min score for selection
  cors:
    allowed-origins: "*"
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
